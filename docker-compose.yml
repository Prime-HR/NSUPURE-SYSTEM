version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: nsupure_db
    restart: always
    environment:
      POSTGRES_USER: nsupure_admin
      POSTGRES_PASSWORD: nsupure_secure_password_2025
      POSTGRES_DB: nsupure_enterprise
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nsupure_admin -d nsupure_enterprise"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    container_name: nsupure_api
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://nsupure_admin:nsupure_secure_password_2025@postgres:5432/nsupure_enterprise?schema=public"
      JWT_SECRET: "nsupure_production_jwt_secret_adumasa_water_enterprise_2025"
      JWT_EXPIRES_IN: "7d"
      UPLOAD_DIR: "/app/uploads"
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    container_name: nsupure_web
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
