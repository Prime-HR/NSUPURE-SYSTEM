services:
  - type: web
    name: nsupure-water-enterprise
    env: node
    plan: free
    region: frankfurt
    autoDeploy: false
    buildCommand: "npm ci --prefix backend && npm ci --prefix frontend && npm run db:provider --prefix backend && npm run prisma:generate --prefix backend && npm run build --prefix backend && npm run build --prefix frontend"
    startCommand: "node backend/dist/server.js"
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: INITIAL_OWNER_USERNAME
        value: owner
      - key: INITIAL_OWNER_PASSWORD
        sync: false
      - key: FRONTEND_URL
        value: https://nsupure-water.onrender.com
      - key: UPLOAD_DIR
        value: ./uploads
