services:
  - type: web
    name: nsupure-water-enterprise
    env: node
    plan: free
    region: frankfurt
    buildCommand: "npm install --prefix backend && npm install --prefix frontend && npm run build --prefix backend && npm run build --prefix frontend && npm run prisma:deploy --prefix backend && npm run prisma:seed --prefix backend"
    startCommand: "node backend/dist/server.js"
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: INITIAL_OWNER_PASSWORD
        value: Nsupure2025!
      - key: UPLOAD_DIR
        value: ./uploads
